name: Keep app awake

# Streamlit Community Cloud sleeps apps after 12 hours without visitors.
# Visiting every 4 hours leaves room for GitHub's scheduled runs, which
# can start late. Odd minute on purpose: on-the-hour slots are the busiest.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install a headless browser
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit the app (and wake it if needed)
        run: python scripts/keep_awake.py
