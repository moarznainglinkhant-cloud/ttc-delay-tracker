name: Update delay data

on:
  schedule:
    # Runs daily at 09:10 UTC (~5:10am Toronto time / adjusts with DST)
    - cron: "10 9 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest TTC delay data
        run: python fetch_data.py

      - name: Commit updated database if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- ttc_delays.db; then
            git add ttc_delays.db
            git commit -m "Auto-update TTC delay data $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit."
          fi
